<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niv-Mizzet, Parun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    #chart text { font-family: inherit; }
    #chart .tick line { stroke: #f1f5f9; }
    #chart .domain { display: none; }
  </style>
</head>
<body class="bg-white text-slate-900 antialiased">
  <main class="mx-auto max-w-6xl px-4 py-12 sm:px-8 sm:py-16">
    <header class="mb-10">
      <h1 id="title" class="text-3xl font-semibold tracking-tight sm:text-4xl">Niv-Mizzet, Parun</h1>
      <p id="subtitle" class="mt-2 text-sm text-slate-500">&nbsp;</p>
    </header>

    <div class="grid items-start gap-10 md:grid-cols-[minmax(0,4fr)_minmax(0,8fr)]">
      <figure class="mx-auto w-full max-w-xs md:max-w-none">
        <img id="card" alt="Ilustración de Niv-Mizzet, Parun"
             class="aspect-[488/680] w-full rounded-[4.75%] bg-slate-100 shadow-sm">
      </figure>

      <section>
        <h2 class="text-base font-medium">Precio en 2026</h2>
        <p id="source" class="mt-1 text-xs text-slate-400">&nbsp;</p>
        <div id="chart" class="relative mt-6 w-full">
          <div id="tooltip" class="pointer-events-none absolute z-10 hidden rounded-md border border-slate-200 bg-white px-3 py-2 text-xs shadow-sm"></div>
        </div>
        <p id="note" class="mt-4 text-xs text-slate-400"></p>
      </section>
    </div>
  </main>

  <script>
    d3.timeFormatDefaultLocale({
      dateTime: '%A, %e de %B de %Y, %X', date: '%d/%m/%Y', time: '%H:%M:%S',
      periods: ['AM', 'PM'],
      days: ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'],
      shortDays: ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'],
      months: ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'],
      shortMonths: ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'],
    });

    const parseDate = d3.utcParse('%Y-%m-%d');
    const fmtPrice = d3.format('$.2f');
    const fmtDay = d3.utcFormat('%-d %b %Y');
    const fmtMonth = d3.utcFormat('%b');

    fetch('data/niv-mizzet.json')
      .then(r => r.json())
      .then(data => {
        const { card } = data;
        const id = card.scryfallId;
        document.getElementById('card').src =
          `https://cards.scryfall.io/large/front/${id[0]}/${id[1]}/${id}.jpg`;
        document.getElementById('subtitle').textContent = `${card.set} · #${card.number}`;
        document.getElementById('source').textContent = data.source;

        const prices = Object.entries(data.prices)
          .map(([date, price]) => ({ date: parseDate(date), price }));
        // Solo las ediciones que salen dentro del periodo con precio
        const [first, last] = d3.extent(prices, d => d.date);
        const sets = data.sets
          .map(s => ({ ...s, date: parseDate(s.releaseDate) }))
          .filter(s => s.date >= first && s.date <= last);

        const fmtLong = d3.utcFormat('%-d de %B');
        document.getElementById('note').textContent =
          `Del ${fmtLong(first)} al ${fmtLong(last)}. Iconos: lanzamiento oficial de ${sets.map(s => s.name).join(', ')}.`;

        const draw = () => drawChart(prices, sets);
        draw();
        new ResizeObserver(draw).observe(document.getElementById('chart'));
      });

    function drawChart(prices, sets) {
      const container = document.getElementById('chart');
      const tooltip = document.getElementById('tooltip');
      d3.select(container).select('svg').remove();

      const width = container.clientWidth;
      const height = Math.max(260, Math.min(420, width * 0.6));
      const m = { top: 40, right: 24, bottom: 32, left: 48 };
      const iconSize = 16;

      const x = d3.scaleUtc().domain(d3.extent(prices, d => d.date)).range([m.left, width - m.right]);
      const [lo, hi] = d3.extent(prices, d => d.price);
      const pad = Math.max((hi - lo) * 0.25, 0.25);
      const y = d3.scaleLinear().domain([Math.max(0, lo - pad), hi + pad]).nice()
        .range([height - m.bottom, m.top]);

      const svg = d3.select(container).append('svg')
        .attr('width', width).attr('height', height)
        .attr('viewBox', [0, 0, width, height]);

      // Eje Y con rejilla horizontal
      svg.append('g')
        .attr('transform', `translate(${m.left},0)`)
        .call(d3.axisLeft(y).ticks(5).tickFormat(fmtPrice).tickSize(-(width - m.left - m.right)).tickPadding(8))
        .call(g => g.selectAll('text').attr('fill', '#94a3b8').attr('font-size', 11));

      // Eje X: un tick por mes con rejilla vertical
      const xAxisY = height - m.bottom;
      svg.append('g')
        .attr('transform', `translate(0,${xAxisY})`)
        .call(d3.axisBottom(x).ticks(d3.utcMonth.every(1)).tickFormat(fmtMonth).tickSize(-(xAxisY - m.top)).tickPadding(10))
        .call(g => g.selectAll('text').attr('fill', '#94a3b8').attr('font-size', 11))
        .call(g => g.selectAll('.tick text').attr('text-anchor', 'start').attr('dx', 4));
      svg.append('line')
        .attr('x1', m.left).attr('x2', width - m.right)
        .attr('y1', xAxisY).attr('y2', xAxisY)
        .attr('stroke', '#e2e8f0');

      // Línea de precio
      svg.append('path')
        .datum(prices)
        .attr('fill', 'none')
        .attr('stroke', '#0f172a')
        .attr('stroke-width', 1.75)
        .attr('stroke-linejoin', 'round')
        .attr('d', d3.line().x(d => x(d.date)).y(d => y(d.price)).curve(d3.curveMonotoneX));

      // Lanzamientos: icono de la edición sobre la línea, en el precio del día de salida
      const bisect = d3.bisector(d => d.date).center;
      const r = iconSize / 2 + 5;
      const release = svg.append('g').selectAll('g').data(sets).join('g')
        .attr('transform', d => `translate(${x(d.date)},${y(prices[bisect(prices, d.date)].price)})`)
        .attr('aria-label', d => d.name);
      release.append('line')
        .attr('y1', 0).attr('y2', -(r + 6))
        .attr('stroke', '#cbd5e1');
      release.append('circle').attr('r', 2.5).attr('fill', '#0f172a');
      release.append('circle')
        .attr('cy', -(r + 6 + r)).attr('r', r)
        .attr('fill', '#fff').attr('stroke', '#e2e8f0');
      release.append('image')
        .attr('href', d => `data/icons/${d.code.toLowerCase()}.svg`)
        .attr('x', -iconSize / 2).attr('y', -(r + 6 + r) - iconSize / 2)
        .attr('width', iconSize).attr('height', iconSize);

      // Hover: guía vertical, punto y tooltip con el precio
      const focus = svg.append('g').style('display', 'none');
      focus.append('line').attr('y1', m.top).attr('y2', xAxisY).attr('stroke', '#94a3b8');
      focus.append('circle').attr('r', 4).attr('fill', '#0f172a').attr('stroke', '#fff').attr('stroke-width', 2);

      svg.append('rect')
        .attr('x', m.left).attr('y', m.top)
        .attr('width', width - m.left - m.right).attr('height', xAxisY - m.top)
        .attr('fill', 'transparent')
        .on('pointermove', event => {
          const [px] = d3.pointer(event);
          const date = x.invert(px);
          if (date < prices[0].date || date > prices[prices.length - 1].date) return hide();
          const d = prices[bisect(prices, date)];
          const cx = x(d.date), cy = y(d.price);
          focus.style('display', null);
          focus.select('line').attr('x1', cx).attr('x2', cx);
          focus.select('circle').attr('cx', cx).attr('cy', cy);
          tooltip.innerHTML = `<div class="text-slate-400">${fmtDay(d.date)}</div><div class="mt-0.5 text-sm font-semibold text-slate-900">${fmtPrice(d.price)}</div>`;
          tooltip.classList.remove('hidden');
          const left = cx + 12 + tooltip.offsetWidth > width ? cx - 12 - tooltip.offsetWidth : cx + 12;
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${Math.max(0, cy - tooltip.offsetHeight - 10)}px`;
        })
        .on('pointerleave', hide);

      function hide() {
        focus.style('display', 'none');
        tooltip.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
